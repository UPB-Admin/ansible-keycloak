- name: restart node exporter
  become: yes
  systemd:
    name: node_exporter
    state: restarted
    enabled: yes
  when: '"node" in prometheus_exporters_to_install'
  listen:
    - restart exporters

- name: restart database exporter
  become: yes
  systemd:
    name: database_exporter
    state: restarted
    enabled: yes
  when: '"database" in prometheus_exporters_to_install'
  listen:
    - restart exporters

- name: restart haproxy exporter
  become: yes
  systemd:
    name: haproxy_exporter
    state: restarted
    enabled: yes
  when: '"haproxy" in prometheus_exporters_to_install'
  listen:
    - restart exporters
